name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Tier 1 — structural (deterministic, free)
      - name: Validate skills (Tier 1)
        run: node scripts/validate-skills.js

      # Tier 2 — trigger/routing (deterministic, free). Never run --behavioral in CI.
      - name: Trigger/routing evals (Tier 2)
        run: node scripts/run-evals.js

      # E2E deterministic suite (scripts, hook, session-status, eval-harness self-test).
      # Forced through bash so it runs identically on the Windows runner (Git Bash).
      - name: E2E test suite
        shell: bash
        run: bash tests/run-tests.sh
